{% extends 'admin/base.html' %}

{% block title %}{% if product %}Редагувати товар{% else %}Додати товар{% endif %} - Адмін{% endblock %}

{% block content %}
    <h1>{% if product %}Редагувати товар{% else %}Додати товар{% endif %}</h1>
    
    <div class="table-container">
        <form method="POST">
            <div class="form-group">
                <label for="name">Назва товару *</label>
                <input type="text" id="name" name="name" value="{{ product.name if product else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="category">Категорія *</label>
                <input type="text" id="category" name="category" value="{{ product.category if product else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="price">Ціна (грн) *</label>
                <input type="number" step="0.01" id="price" name="price" value="{{ product.price if product else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="stock">Кількість на складі *</label>
                <input type="number" id="stock" name="stock" value="{{ product.stock if product else 0 }}" required>
            </div>
            
            <div class="form-group">
                <label for="image">Зображення (назва файлу)</label>
                <input type="text" id="image" name="image" value="{{ product.image if product else '' }}" placeholder="product.jpg">
            </div>
            
            <div class="form-group">
                <label for="description">Опис</label>
                <textarea id="description" name="description">{{ product.description if product else '' }}</textarea>
            </div>
            
            <div class="actions">
                <button type="submit" class="btn btn-success">{% if product %}Оновити{% else %}Додати{% endif %}</button>
                <a href="{{ url_for('admin_products') }}" class="btn btn-primary">Скасувати</a>
            </div>
        </form>
    </div>
{% endblock %}
